name: release
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@7a445ee88d4e23b52c33d4b7b3e58d9c0ab65c74
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - run: sha256sum target/app.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            target/app.jar
            SHA256SUMS
          retention-days: 30

  deploy-production:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
      - run: sha256sum --check SHA256SUMS
      - name: Exchange GitHub OIDC token for short-lived cloud credentials
        run: echo 'Use the cloud vendor login action pinned to a reviewed full commit SHA'
